name: Bug report / 问题反馈
description: Report a reproducible Flameshoter issue / 反馈可复现的问题
body:
  - type: input
    id: version
    attributes:
      label: Flameshoter version / 应用版本
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and displays / 系统版本与显示器配置
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation / 安装方式
      options: [Homebrew, GitHub release, Built from source]
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual result / 复现步骤、预期和实际结果
    validations:
      required: true
  - type: textarea
    id: images
    attributes:
      label: Optional screenshots / 可选截图
      description: Remove private information before attaching / 请先移除私人信息
