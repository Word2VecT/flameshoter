name: Build and release macOS
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Verify native editor and application behavior
        run: ./scripts/test-native.sh
      - name: Import fixed release signing identity
        if: github.event_name != 'pull_request'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: python3 scripts/import-macos-signing.py
      - name: Build and verify portable app
        run: |
          ./scripts/build-macos.sh --package
          VERSION=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          python3 scripts/make-cask.py --archive "dist/Flameshoter-$VERSION-macos-arm64.zip" \
            --version "$VERSION" --out dist/Casks/flameshoter.rb
          (cd dist && shasum -a 256 "Flameshoter-$VERSION-macos-arm64.zip" > SHA256SUMS)
      - name: Remove signing keychain
        if: always() && env.MACOS_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_SIGN_KEYCHAIN"
      - name: Verify release signing identity without the signing keychain
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(cat VERSION)
          ditto -x -k "dist/Flameshoter-$VERSION-macos-arm64.zip" "$RUNNER_TEMP/signature-audit"
          python3 scripts/verify-macos-signature.py --app "$RUNNER_TEMP/signature-audit/Flameshoter.app"
      - uses: actions/upload-artifact@v7
        with:
          name: flameshoter-macos-arm64
          path: dist/
  release:
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVISION=$(git rev-parse HEAD)
          SOURCE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/macos.yml/runs?head_sha=$REVISION&branch=master&status=success&per_page=50" \
            --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | .[0].id // empty')
          if [[ -z "$SOURCE_RUN" ]]; then
            echo 'A successful master build of this exact commit is required before tagging a release.' >&2
            exit 1
          fi
          VERSION=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n flameshoter-macos-arm64 -D dist
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS dist/Casks/flameshoter.rb \
            --title "Flameshoter $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
